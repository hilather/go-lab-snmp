apiVersion: labsnmp.dev/v1alpha1
kind: LabSNMP
metadata:
  name: defaults
spec:
  maps:
    - name: system-if
      objects:
        - oid: "10.20.0.3.10.20.0.5.0"
          name: sysDescr
          type: octetString
          value: "LabSNMP"
        - oid: "10.20.0.3.10.20.0.4.0"
          name: sysUpTime
          type: timeTicks
          valueFrom: uptime
  communities:
    - name: public
      communityFile: testdata/secrets/snmp-public
      map: system-if

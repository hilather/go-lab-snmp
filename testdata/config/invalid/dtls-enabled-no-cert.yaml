apiVersion: labsnmp.dev/v1alpha1
kind: LabSNMP
metadata:
  name: x
spec:
  listeners:
    dtls:
      enabled: true
  maps:
    - name: system-if
      objects:
        - oid: "10.20.0.3.10.20.0.5.0"
